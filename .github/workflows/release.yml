# Release on a version tag: static musl builds (flake.nix staticFor) packed as
# .deb, AppImage and plain tarballs, attached to the GitHub release of the tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, deb: amd64, appimage: true }
          - { arch: aarch64, deb: arm64, appimage: true }
          - { arch: armv7, deb: armhf, appimage: false }
    steps:
      - uses: actions/checkout@v4

      # The tag is the release version; it must match the crate's so that
      # `xxh --version` and the package version agree.
      - name: Version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/xxh-cli/Cargo.toml | head -1)
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crates/xxh-cli version $crate"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v15
        continue-on-error: true
        with:
          name: xxh
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build static xxh
        run: nix build .#xxh-static-${{ matrix.arch }} -o static --print-build-logs

      - name: Tarball
        run: |
          mkdir -p dist
          name="xxh-${VERSION}-${{ matrix.arch }}-linux-musl"
          mkdir "$name"
          cp -r --no-preserve=mode static/. "$name/"
          chmod 755 "$name/bin/xxh"
          tar -czf "dist/$name.tar.gz" "$name"

      - name: .deb
        env:
          DEB_MAINTAINER: ${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>
        run: packaging/deb.sh static "$VERSION" ${{ matrix.deb }} dist

      - name: AppImage
        if: matrix.appimage
        run: |
          base=https://github.com/AppImage
          curl -fsSLo appimagetool "$base/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          curl -fsSLo runtime "$base/type2-runtime/releases/download/continuous/runtime-${{ matrix.arch }}"
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool" APPIMAGE_RUNTIME="$PWD/runtime" \
            packaging/appimage.sh static "$VERSION" ${{ matrix.arch }} dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
