# Spec kit extension hooks for xxh.
#
# The /speckit-* skills read this file and run the commands below at the named
# points of the cycle. Command ids map to skills by replacing dots with hyphens
# (`xxh.quality-gates` → /xxh-quality-gates, `speckit.analyze` → /speckit-analyze).
# `optional: false` hooks run automatically; `optional: true` hooks are offered.
#
# specs/ROADMAP.md is NOT a hook here: it is regenerated by the Claude Code
# PostToolUse hook (.claude/hooks/post-edit.sh) on every spec artefact change.

installed: []

settings:
  auto_execute_hooks: true

hooks:
  after_tasks:
    - extension: xxh
      command: speckit.analyze
      enabled: true
      optional: false
      description: Сверить spec.md, plan.md и tasks.md до начала реализации
      prompt: Проверить согласованность артефактов и покрытие требований задачами?

  after_implement:
    - extension: xxh
      command: xxh.quality-gates
      enabled: true
      optional: false
      description: Гейты конституции — fmt, clippy, unit, интеграция на реальных контейнерах
      prompt: Прогнать quality gates?
    - extension: xxh
      command: speckit.converge
      enabled: true
      optional: true
      description: Сверить код со спекой и дописать недостающие задачи в tasks.md
      prompt: Проверить, что реализация покрывает спеку целиком?
    - extension: xxh
      command: xxh.git
      enabled: true
      optional: false
      description: Закоммитить фичу в её ветке по конвенциям репозитория
      prompt: Закоммитить сделанное?
